<section class="hero" id="hero">
  <span class="hero__circle" aria-hidden="true"></span>

  <div class="hero__inner">
    <div class="hero__text">
      <p class="hero__greeting">{{ hero().greeting }}</p>
      <h1 class="hero__title">
        <span class="hero__title-line hero__title-line--top">{{ hero().jobTitleLine1 }}</span>
        <span class="hero__title-line hero__title-line--bottom">{{ hero().jobTitleLine2 }}</span>
      </h1>

      <a class="hero__scroll" href="#about">
        <span class="hero__scroll-label">{{ hero().scroll }}</span>
        <span class="hero__scroll-line" aria-hidden="true"></span>
        <svg
          class="hero__scroll-arrow"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 4v15M5 12l7 7 7-7" />
        </svg>
      </a>
    </div>

    <div class="hero__portrait">
      <img
        class="hero__portrait-image"
        src="/img/avatar/profile-cutout.webp"
        srcset="
          /img/avatar/profile-cutout-320.webp 320w,
          /img/avatar/profile-cutout-408.webp 408w,
          /img/avatar/profile-cutout-768.webp 768w
        "
        sizes="(min-width: 64rem) 45vw, 100vw"
        width="768"
        height="1152"
        [alt]="hero().portraitAlt"
        fetchpriority="high"
        decoding="async"
      />
    </div>
  </div>

  <app-social-links class="hero__social" orientation="vertical" />
</section>
