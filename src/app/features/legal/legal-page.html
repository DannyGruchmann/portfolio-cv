<article class="legal">
  <span class="legal__circle" aria-hidden="true"></span>

  <div class="legal__inner">
    <h1 class="legal__title">{{ page().title }}</h1>

    @for (section of page().sections; track section.heading) {
      <section class="legal__section">
        <h2 class="legal__heading">{{ section.heading }}</h2>
        @for (paragraph of section.paragraphs; track $index) {
          <p class="legal__text">{{ paragraph }}</p>
        }
      </section>
    }
  </div>
</article>
